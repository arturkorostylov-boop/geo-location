<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="./style.css">
    <!-- <script defer src="./script.js"></script> -->
    <script defer src="./script-map.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geolocation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
</head>

<body class="pt-sans-regular">
    <h1 class="changa-one-regular">Search of places by coordinates</h1>
    <form action="" id="coordinatesForm">
        <div>
            <label for="latitude"><strong>Latitude</strong></label>
            <!-- <input id="latitude" type="number" required value="55.87" step="any" name="latitude"> -->
            <input id="latitude" type="number" required step="any" name="latitude">
        </div>
        <div>
            <label for="longitude"><strong>Longitude</strong></label>
            <!-- <input id="longitude" type="number" required value="-4.27" step="any" name="longitude"> -->
            <input id="longitude" type="number" required step="any" name="longitude">
        </div>
        <button type="submit" class="changa-one-regular">Find name of place</button>
        <button type="button" class="changa-one-regular" id="detectLocation">Where am I?</button>
    </form>
    <div id="result">
        result is here
    </div>
</body>

</html>
